<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Poppins', sans-serif;
  background-color: #454545;
  color: #e6e6e6;
}

nav {
  background-color: #2e2e2e;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #a7a39c;
  position: sticky;
}

nav .logo { color: #e6e6e6; font-size: 22px; font-weight: 700; text-decoration: none; }
nav ul { list-style: none; display: flex; gap: 20px; }
nav ul li a { color: #a7a39c; text-decoration: none; font-size: 15px; }
nav ul li a:hover { color: #e6e6e6; }
nav ul li a.active { color: #e6e6e6; font-weight: 600; border-bottom: 2px solid #e6e6e6; }

h1 {
  text-align: center;
  font-size: 32px;
  color: #e6e6e6;
  padding: 40px 20px 10px 20px;
}

.page-subtitle {
  text-align: center;
  font-size: 15px;
  margin-bottom: 30px;
}

.glass-card {
  background-color: #3a3a3a;
  border: 1px solid #a7a39c;
  border-radius: 10px;
  padding: 35px;
  max-width: 600px;
  margin: 0 auto 40px auto;
}

.glass-card h3 { color: #e6e6e6; font-size: 17px; margin-bottom: 14px; }

.form-group { margin-bottom: 18px; }

label {
  display: block;
  font-size: 14px;
  color: #e1d8cb;
  font-weight: 600;
  margin-bottom: 6px;
}

input[type="text"],
textarea {
  width: 100%;
  padding: 10px 14px;
  background-color: #2e2e2e;
  border: 1px solid #a7a39c;
  border-radius: 5px;
  color: #e6e6e6;
  font-size: 14px;
  font-family: 'Poppins', sans-serif;
}

textarea { height: 100px; resize: vertical; }

.rating-label {
  font-size: 14px;
  color: #e1d8cb;
  font-weight: 600;
  margin-bottom: 8px;
  display: block;
}

.stars { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.stars label {
  cursor: pointer;
  font-size: 14px;
  color: #a7a39c;
  display: flex;
  align-items: center;
  gap: 5px;
  font-weight: 400;
}
.stars input[type="radio"] { width: 16px; height: 16px; accent-color: #e1d8cb; }

.checkbox-group { display: flex; flex-direction: column; gap: 8px; }
.checkbox-group label {
  color: #a7a39c;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  cursor: pointer;
  font-weight: 400;
}
.checkbox-group input[type="checkbox"] { width: 16px; height: 16px; accent-color: #e1d8cb; }

input[type="submit"] {
  background-color: #36ff39;
  color: #252525;
  padding: 12px 30px;
  font-size: 15px;
  font-weight: 700;
  border-radius: 5px;
  cursor: pointer;
  width: 100%;
  margin-top: 5px;
  font-family: 'Poppins', sans-serif;
}

footer {
  text-align: center;
  padding: 20px;
  border-top: 1px solid #a7a39c;
  color: #a7a39c;
  font-size: 13px;
}
</style>
</head>
<body>

<nav>
<a href="index.html" class="logo">PERTHFOLIO !</a>
<ul>
  <li><a href="index.html">Home</a></li>
  <li><a href="about.html">About</a></li>
  <li><a href="contact.html">Contact</a></li>
  <li><a href="feedback.html" class="active">Feedback</a></li>
</ul>
</nav>

<h1>Feedback</h1>
<p class="page-subtitle">What do you think about my portfolio?</p>

<div class="glass-card">
<form action="" method="post">


  <div class="form-group">
    <span class="rating-label">Rate My Website</span>
    <div class="stars">
      <label><input type="radio" name="rating" value="1"> ⭐  Poor</label>
      <label><input type="radio" name="rating" value="2"> ⭐  Good</label>
      <label><input type="radio" name="rating" value="3"> ⭐  Fair</label>
      <label><input type="radio" name="rating" value="4"> ⭐  Great</label>
      <label><input type="radio" name="rating" value="5"> ⭐  WOW</label>
    </div>
  </div>

  <div class="form-group">
    <span class="rating-label">What did you like about my portfolio? (Check all that apply)</span>
    <div class="checkbox-group">
      <label><input type="checkbox" name="liked" value="vd"> Video Editing</label>
      <label><input type="checkbox" name="liked" value="photo"> Photography </label>
      <label><input type="checkbox" name="liked" value="pub"> Pubmat </label>
      <label><input type="checkbox" name="liked" value="illu"> Digital Illustrations</label>
    </div>
  </div>

  <div class="form-group">
    <label for="comments">Any Comments or Suggestions?</label>
    <textarea id="comments" name="comments" placeholder="Write your feedback here..."></textarea>
  </div>
  <input type="submit" value="Submit Feedback">

</form>
</div>

<footer>
<p>&copy; 2026 PERTHFOLIO. All rights reserved:)</p>
</footer>

</body>
</html>
